apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  namespace: postgres
  labels:
    app: postgres
data:
  create-root-user.sql: |
    CREATE USER "root" WITH ENCRYPTED PASSWORD 'e2e-root-password' CREATEDB CREATEROLE;
    ALTER DATABASE "postgres" OWNER TO "root";
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: postgres
  labels:
    app: postgres
spec:
  containers:
  - name: postgres
    image: postgres:15
    env:
    - name: POSTGRES_PASSWORD
      value: "e2e-postgres-password"
    ports:
    - containerPort: 5432
      name: postgres
    volumeMounts:
    - name: entrypoints
      mountPath: /docker-entrypoint-initdb.d
  volumes:
  - name: entrypoints
    configMap:
      name: postgres
      defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: postgres
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: postgres
type: Opaque
stringData:
  password: e2e-root-password
